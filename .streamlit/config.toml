[theme]
# 차분한 보안 실습 환경: 어두운 남색 바탕 + 절제된 청록 강조
base = "dark"
primaryColor = "#13786d"
backgroundColor = "#0f1b2d"
secondaryBackgroundColor = "#172a42"
textColor = "#e6edf5"
linkColor = "#5ccfc0"
borderColor = "#34506f"
font = "'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFont = "'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
baseFontSize = 17
headingFontSizes = ["28px", "22px", "18px"]
headingFontWeights = [700, 700, 700]
baseRadius = "6px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
