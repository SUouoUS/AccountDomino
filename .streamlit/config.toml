[theme]
# 사이버보안 분위기 + 조금 더 밝은 슬레이트·네이비 대비
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#152033"
secondaryBackgroundColor = "#273950"
textColor = "#F4F7FB"
linkColor = "#60A5FA"
borderColor = "#465B75"
font = "'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
headingFont = "'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
baseFontSize = 19
headingFontSizes = ["42px", "32px", "22px"]
headingFontWeights = [700, 700, 700]
baseRadius = "8px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
